services:
# nginx is the entrypoint
  nginx:
    build:
      dockerfile: Dockerfile
      context: requirements/nginx
    image: nginx:inception
    container_name: nginx
    ports:
      - "${NGINX_PORT}:443"
    depends_on:
      - wordpress
    networks:
      - inception
    volumes:
      - wp-volume:/var/www/html
    env_file:
      - .env
    restart: unless-stopped

  wordpress:
    build:
      dockerfile: Dockerfile
      context: requirements/wordpress
    image: wordpress:inception
    container_name: wordpress
    depends_on:
      - mariadb
      - redis
    networks:
      - inception
    volumes:
      - wp-volume:/var/www/html
    env_file:
      - .env
    restart: unless-stopped

  redis:
    build:
      dockerfile: Dockerfile
      context: requirements/redis
    image: redis:inception
    container_name: redis
    networks:
      - inception
    env_file:
      - .env
    restart: unless-stopped

  ftp:
    build:
      dockerfile: Dockerfile
      context: requirements/ftp
    image: ftp:inception
    container_name: ftp
    ports:
      - "${FTP_PORT}:21"
      - "${FTP_PASV_MIN}-${FTP_PASV_MAX}:${FTP_PASV_MIN}-${FTP_PASV_MAX}"
    depends_on:
      - wordpress
    networks:
      - inception
    volumes:
      - wp-volume:/var/www/html
    env_file:
      - .env
    restart: unless-stopped

  adminer:
    build:
      dockerfile: Dockerfile
      context: requirements/adminer
    image: adminer:inception
    container_name: adminer
    depends_on:
      - mariadb
    networks:
      - inception
    restart: unless-stopped

  static-site:
    build:
      dockerfile: Dockerfile
      context: requirements/static-site
    image: static-site:inception
    container_name: static-site
    networks:
      - inception
    restart: unless-stopped

  portainer:
    build:
      dockerfile: Dockerfile
      context: requirements/portainer
    image: portainer:inception
    container_name: portainer
    ports:
      - "${PORTAINER_PORT}:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    networks:
      - inception
    restart: unless-stopped

# database container
  mariadb:
    build:
      dockerfile: Dockerfile
      context: requirements/mariadb
    image: mariadb:inception
    container_name: mariadb
    networks:
      - inception
    volumes:
      - db-volume:/var/lib/mysql
    env_file:
      - .env
    restart: unless-stopped

volumes:
  wp-volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/fbraune/data/wordpress
  db-volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/fbraune/data/mariadb
  portainer-data:
    driver: local

networks:
  inception:
    driver: bridge
