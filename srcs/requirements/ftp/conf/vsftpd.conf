listen=YES
listen_ipv6=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022
dirmessage_enable=YES
xferlog_enable=YES
connect_from_port_20=YES

pam_service_name=vsftpd
secure_chroot_dir=/var/run/vsftpd/empty

chroot_local_user=YES
local_root=/var/www/html
allow_writeable_chroot=YES

pasv_enable=YES
pasv_min_port=PASV_MIN_PORT_PLACEHOLDER
pasv_max_port=PASV_MAX_PORT_PLACEHOLDER
pasv_address=PASV_ADDRESS_PLACEHOLDER

seccomp_sandbox=NO
